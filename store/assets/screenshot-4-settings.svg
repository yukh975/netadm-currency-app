<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="1920" fill="#F5F5F5"/>
  <rect width="1080" height="240" fill="#2E7D32"/>
  <text x="60" y="118" font-size="60" font-weight="700" fill="#FFFFFF">Настройки под себя</text>
  <text x="62" y="184" font-size="34" fill="#C8E6C9">источник, моя валюта, уведомление</text>

  <text x="60" y="350" font-size="40" font-weight="700" fill="#212121">Источник курсов</text>
  <g font-size="36">
    <rect x="60" y="384" width="250" height="78" rx="39" fill="#2E7D32"/>
    <text x="185" y="434" text-anchor="middle" fill="#FFFFFF">🇷🇺 ЦБ РФ</text>
    <rect x="330" y="384" width="290" height="78" rx="39" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="475" y="434" text-anchor="middle" fill="#424242">🌐 Рыночный</text>
  </g>

  <line x1="60" y1="520" x2="1020" y2="520" stroke="#E0E0E0" stroke-width="2"/>
  <text x="60" y="600" font-size="40" font-weight="700" fill="#212121">Моя валюта</text>
  <text x="60" y="650" font-size="30" fill="#9E9E9E">Относительно неё считается сводка</text>
  <g font-size="36">
    <rect x="60" y="684" width="170" height="78" rx="39" fill="#2E7D32"/>
    <text x="145" y="734" text-anchor="middle" fill="#FFFFFF">🇷🇺 RUB</text>
    <rect x="250" y="684" width="170" height="78" rx="39" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="335" y="734" text-anchor="middle" fill="#424242">🇺🇸 USD</text>
    <rect x="440" y="684" width="170" height="78" rx="39" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <text x="525" y="734" text-anchor="middle" fill="#424242">🇪🇺 EUR</text>
  </g>

  <line x1="60" y1="820" x2="1020" y2="820" stroke="#E0E0E0" stroke-width="2"/>
  <text x="60" y="906" font-size="38" font-weight="700" fill="#212121">Ежедневное уведомление</text>
  <text x="60" y="956" font-size="30" fill="#9E9E9E">Сводка курсов избранных валют</text>
  <rect x="880" y="876" width="140" height="72" rx="36" fill="#A5D6A7"/>
  <circle cx="986" cy="912" r="32" fill="#2E7D32"/>

  <text x="60" y="1086" font-size="38" font-weight="700" fill="#212121">Время уведомления</text>
  <text x="60" y="1136" font-size="30" fill="#9E9E9E">Когда присылать сводку</text>
  <rect x="858" y="1056" width="162" height="76" rx="16" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
  <text x="939" y="1108" text-anchor="middle" font-size="40" font-weight="700" fill="#2E7D32">17:00</text>

  <rect x="0" y="1772" width="1080" height="148" fill="#FFFFFF"/>
  <line x1="0" y1="1772" x2="1080" y2="1772" stroke="#E0E0E0" stroke-width="2"/>
  <text x="135" y="1852" text-anchor="middle" font-size="46">🔄</text>
  <text x="405" y="1852" text-anchor="middle" font-size="46">⭐</text>
  <text x="675" y="1852" text-anchor="middle" font-size="46">⚙️</text>
  <text x="945" y="1852" text-anchor="middle" font-size="46">ℹ️</text>
  <text x="675" y="1902" text-anchor="middle" font-size="26" fill="#2E7D32" font-weight="700">Настройки</text>
</svg>
