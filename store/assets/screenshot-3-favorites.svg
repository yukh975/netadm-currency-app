<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1080" height="1920" fill="#F5F5F5"/>
  <rect width="1080" height="240" fill="#2E7D32"/>
  <text x="60" y="118" font-size="60" font-weight="700" fill="#FFFFFF">Любые валюты в избранном</text>
  <text x="62" y="184" font-size="34" fill="#C8E6C9">поиск по коду, названию, стране</text>

  <rect x="60" y="320" width="960" height="110" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <text x="92" y="390" font-size="36" fill="#9E9E9E">🔎  Поиск: юань</text>

  <rect x="60" y="456" width="960" height="100" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  <text x="92" y="518" font-size="36" fill="#212121">🇨🇳 Китай — Китайский юань</text>
  <text x="980" y="518" text-anchor="end" font-size="36" fill="#2E7D32">✅</text>

  <line x1="60" y1="610" x2="1020" y2="610" stroke="#E0E0E0" stroke-width="2"/>
  <text x="60" y="676" font-size="40" font-weight="700" fill="#212121">Избранное</text>

  <g font-size="38" fill="#212121">
    <text x="60" y="760">🇷🇺 RUB — Российский рубль</text>
    <text x="980" y="760" text-anchor="end" fill="#C62828">✕</text>
    <text x="60" y="844">🇺🇸 USD — Доллар США</text>
    <text x="980" y="844" text-anchor="end" fill="#C62828">✕</text>
    <text x="60" y="928">🇪🇺 EUR — Евро</text>
    <text x="980" y="928" text-anchor="end" fill="#C62828">✕</text>
    <text x="60" y="1012">🇨🇳 CNY — Китайский юань</text>
    <text x="980" y="1012" text-anchor="end" fill="#C62828">✕</text>
    <text x="60" y="1096">🇬🇪 GEL — Грузинский лари</text>
    <text x="980" y="1096" text-anchor="end" fill="#C62828">✕</text>
  </g>

  <rect x="0" y="1772" width="1080" height="148" fill="#FFFFFF"/>
  <line x1="0" y1="1772" x2="1080" y2="1772" stroke="#E0E0E0" stroke-width="2"/>
  <text x="135" y="1852" text-anchor="middle" font-size="46">🔄</text>
  <text x="405" y="1852" text-anchor="middle" font-size="46">⭐</text>
  <text x="675" y="1852" text-anchor="middle" font-size="46">⚙️</text>
  <text x="945" y="1852" text-anchor="middle" font-size="46">ℹ️</text>
  <text x="405" y="1902" text-anchor="middle" font-size="26" fill="#2E7D32" font-weight="700">Избранное</text>
