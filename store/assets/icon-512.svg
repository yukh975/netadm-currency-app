<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Иконка магазина 512x512. Полная заливка (без прозрачности) — подходит и
       для Google Play, и для RuStore. Мотив: ₽ ⇄ $ на зелёном градиенте. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43A047"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="150" y="260" font-family="Arial, Helvetica, sans-serif" font-size="210"
        font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">₽</text>
  <text x="362" y="260" font-family="Arial, Helvetica, sans-serif" font-size="210"
        font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">$</text>
  <g stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 226 H300 M284 210 L300 226 L284 242"/>
    <path d="M298 294 H212 M228 278 L212 294 L228 310"/>
  </g>
</svg>
