# Сборка Android APK в Docker-раннере GitLab.
# Образ с JDK 17, Android SDK ставится через cmdline-tools.
image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Версия приложения — единая с Telegram-ботом (ручной SemVer, см. CHANGELOG.md).
  # Поднимать вручную при выпуске новой версии — СИНХРОННО с appVersionName и
  # appVersionCode в app/build.gradle.kts (там литералы — требование F-Droid).
  APP_VERSION: "0.6.0"

# Все джобы по умолчанию — на Docker-раннере: этот инстанс не берёт джобы без
# тега `docker`. Джобы под другой раннер (например FreeBSD) переопределяют `tags`.
default:
  tags:
    - docker

# Когда создавать пайплайн.
workflow:
  rules:
    # не запускать на создание тега (релиз сам делает тег) — без петли
    - if: '$CI_COMMIT_TAG'
      when: never
    # ручной запуск из UI/CLI — всегда (на случай пересборки без изменений кода)
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # собирать только при изменении кода или условий сборки
    - changes:
        - app/**/*
        - gradle/**/*
        - settings.gradle.kts
        - build.gradle.kts
        - gradle.properties
        - gradlew
        - gradlew.bat
        - .gitlab-ci.yml
    # иначе (README, CHANGELOG, store/* и пр.) — пайплайн не создаётся
    - when: never

stages:
  - build
  - release
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .android-sdk/

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  - export ANDROID_HOME="$CI_PROJECT_DIR/.android-sdk"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - mkdir -p "$ANDROID_HOME/cmdline-tools"
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      wget --quiet --output-document=cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
      unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      rm cmdline-tools.zip
    fi
  - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null
  - chmod +x ./gradlew

# Подписанный релиз (APK + AAB). Запускается только если задана переменная
# KEYSTORE_BASE64 (CI/CD Variables). Нужны также: KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
assembleRelease:
  stage: build
  rules:
    - if: '$KEYSTORE_BASE64'
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_FILE="$CI_PROJECT_DIR/release.keystore"
    # direct — APK для sideload/GitLab (со встроенным апдейтером);
    # play — AAB для Google Play (без апдейтера и лишних разрешений);
    # fdroid — APK для каталога F-Droid (без апдейтера; кладём в релиз как
    # fdroid.apk — F-Droid байт-сравнивает свою сборку с этим файлом).
    - ./gradlew --no-daemon assembleDirectRelease bundlePlayRelease assembleFdroidRelease
    - rm -f "$CI_PROJECT_DIR/release.keystore"
  artifacts:
    name: "currency-converter-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/direct/release/*.apk
      - app/build/outputs/bundle/playRelease/*.aab
      - app/build/outputs/apk/fdroid/release/*.apk
    expire_in: 1 month

# ---- Релиз в GitLab: APK/AAB в Package Registry + запись в Releases ----

# Заливаем подписанные артефакты в Generic Package Registry (стабильные ссылки).
upload-packages:
  stage: release
  image: alpine:latest
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "android" && $KEYSTORE_BASE64'
  before_script: []
  cache: {}
  variables:
    VERSION: "$APP_VERSION"
    PKG_BASE: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION"
  script:
    - apk add --no-cache curl
    - APK=$(ls app/build/outputs/apk/direct/release/*.apk | head -1)
    - AAB=$(ls app/build/outputs/bundle/playRelease/*.aab | head -1)
    - FDROID_APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$APK" "$PKG_BASE/currency-converter-$VERSION.apk"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$AAB" "$PKG_BASE/currency-converter-$VERSION.aab"'
    # Короткое имя fdroid.apk — строка Binaries в метаданных F-Droid ограничена ~90 символами.
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$FDROID_APK" "$PKG_BASE/fdroid.apk"'

# Создаём GitLab Release с тегом и ссылками на артефакты в Package Registry.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload-packages
  rules:
    - if: '$CI_COMMIT_BRANCH == "android" && $KEYSTORE_BASE64'
  before_script: []
  cache: {}
  variables:
    VERSION: "$APP_VERSION"
  script:
    - echo "Создаю релиз v$APP_VERSION (пайплайн $CI_PIPELINE_IID)"
  release:
    tag_name: "v$APP_VERSION"
    name: "Конвертер валют v$APP_VERSION"
    ref: "$CI_COMMIT_SHA"
    description: "Релиз v$APP_VERSION (сборка пайплайна #$CI_PIPELINE_IID). Список изменений — в CHANGELOG.md."
    assets:
      links:
        - name: "APK (app-release)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION/currency-converter-$APP_VERSION.apk"
          link_type: "package"
        - name: "AAB (app-release)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION/currency-converter-$APP_VERSION.aab"
          link_type: "package"
        - name: "fdroid.apk (сборка для F-Droid)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION/fdroid.apk"
          link_type: "package"

# Зеркалим релиз на GitHub (github.com/yukh975/netadm-currency-app) — источник
# для F-Droid: ветка android, тег версии и GitHub-релиз с APK-ассетами
# (fdroid.apk — файл байт-сравнения reproducible builds). Пушится ТОЛЬКО ветка
# android и теги версий — код бота (main) на GitHub не попадает. Сбой зеркала
# не валит канонический релиз (allow_failure).
publish-github:
  stage: release
  image: alpine:latest
  needs:
    - job: assembleRelease
      artifacts: true
    - job: create-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "android" && $KEYSTORE_BASE64 && $GITHUB_TOKEN'
  allow_failure: true
  before_script: []
  cache: {}
  variables:
    GIT_DEPTH: "0"
    GH_REPO: "yukh975/netadm-currency-app"
  script:
    - apk add --no-cache git curl jq
    - GH_URL="https://yukh975:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
    # ветка android (актуальный HEAD origin) + тег релиза
    - git fetch origin android
    - git push "$GH_URL" "refs/remotes/origin/android:refs/heads/android"
    - git push "$GH_URL" "$CI_COMMIT_SHA:refs/tags/v$APP_VERSION" || true
    # GitHub-релиз: взять существующий или создать
    - 'REL_ID=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GH_REPO/releases/tags/v$APP_VERSION" | jq -r ".id // empty")'
    - |
      if [ -z "$REL_ID" ]; then
        REL_ID=$(curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GH_REPO/releases" \
          -d "{\"tag_name\":\"v$APP_VERSION\",\"name\":\"Конвертер валют v$APP_VERSION\",\"body\":\"Релиз v$APP_VERSION. Список изменений — в CHANGELOG.md. fdroid.apk — сборка для каталога F-Droid.\"}" | jq -r '.id')
      fi
    - echo "GitHub release id=$REL_ID"
    - APK=$(ls app/build/outputs/apk/direct/release/*.apk | head -1)
    - FDROID_APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
    - 'curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$FDROID_APK" "https://uploads.github.com/repos/$GH_REPO/releases/$REL_ID/assets?name=fdroid.apk" | jq -r ".state"'
    - 'curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK" "https://uploads.github.com/repos/$GH_REPO/releases/$REL_ID/assets?name=currency-converter-$APP_VERSION.apk" | jq -r ".state"'

# ---- Публикация (ручной запуск, активна при наличии креденшелов) ----
# Берёт собранный артефакт из assembleRelease, заливает в магазин.
# Не трогает Android-сборку, поэтому build остаётся стабильным.

# Google Play. Нужна переменная PLAY_SA_JSON_B64 = base64(service account JSON).
publish-googleplay:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$PLAY_SA_JSON_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet google-api-python-client google-auth
    - echo "$PLAY_SA_JSON_B64" | base64 -d > sa.json
    - AAB=$(ls app/build/outputs/bundle/playRelease/*.aab | head -1)
    - python3 store/publish_googleplay.py --aab "$AAB" --package net.yukh.currency --track internal --credentials sa.json
    - rm -f sa.json

# RuStore. Нужны RUSTORE_KEY_ID и RUSTORE_KEY_B64 = base64(приватный RSA PEM).
publish-rustore:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$RUSTORE_KEY_ID && $RUSTORE_KEY_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet requests cryptography
    - echo "$RUSTORE_KEY_B64" | base64 -d > rustore_key.pem
    - APK=$(ls app/build/outputs/apk/direct/release/*.apk | head -1)
    - python3 store/rustore_publish.py --apk "$APK" --package net.yukh.currency --key-id "$RUSTORE_KEY_ID" --key rustore_key.pem --email yukh975@gmail.com --whats-new "Версия $APP_VERSION. Список изменений — в CHANGELOG.md." --min-android 7
    - rm -f rustore_key.pem
