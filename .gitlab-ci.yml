# Сборка Android APK в Docker-раннере GitLab.
# Образ с JDK 17, Android SDK ставится через cmdline-tools.
image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - build

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .android-sdk/

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  - export ANDROID_HOME="$CI_PROJECT_DIR/.android-sdk"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - mkdir -p "$ANDROID_HOME/cmdline-tools"
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      wget --quiet --output-document=cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
      unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      rm cmdline-tools.zip
    fi
  - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null
  - chmod +x ./gradlew

# Разовая генерация release-keystore на раннере. Запуск только при GEN_KEYSTORE=yes.
# Артефакты (keystore + пароли) забираются и сохраняются в CI/CD Variables, после
# чего эта задача удаляется из конфига.
gen-keystore:
  stage: build
  rules:
    - if: '$GEN_KEYSTORE == "yes"'
  before_script: []
  cache: {}
  script:
    - STOREPASS=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
    - KEYALIAS=currency
    - keytool -genkeypair -v -keystore release.keystore -alias "$KEYALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=Currency Converter, O=yukh, C=RU"
    - base64 -w0 release.keystore > keystore.b64
    - printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=%s\n' "$STOREPASS" "$STOREPASS" "$KEYALIAS" > creds.env
  artifacts:
    paths:
      - keystore.b64
      - creds.env
      - release.keystore
    expire_in: 1 day

assembleDebug:
  stage: build
  rules:
    - if: '$GEN_KEYSTORE == "yes"'
      when: never
    - when: on_success
  script:
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    name: "currency-converter-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 week

# Подписанный релиз (APK + AAB). Запускается только если задана переменная
# KEYSTORE_BASE64 (CI/CD Variables). Нужны также: KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
assembleRelease:
  stage: build
  rules:
    - if: '$KEYSTORE_BASE64'
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_FILE="$CI_PROJECT_DIR/release.keystore"
    - ./gradlew --no-daemon assembleRelease bundleRelease
    - rm -f "$CI_PROJECT_DIR/release.keystore"
  artifacts:
    name: "currency-converter-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    expire_in: 1 month
