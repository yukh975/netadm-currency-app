# Сборка Android APK в Docker-раннере GitLab.
# Образ с JDK 17, Android SDK ставится через cmdline-tools.
image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - build
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .android-sdk/

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  - export ANDROID_HOME="$CI_PROJECT_DIR/.android-sdk"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - mkdir -p "$ANDROID_HOME/cmdline-tools"
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      wget --quiet --output-document=cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
      unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      rm cmdline-tools.zip
    fi
  - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null
  - chmod +x ./gradlew

assembleDebug:
  stage: build
  script:
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    name: "currency-converter-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 week

# Подписанный релиз (APK + AAB). Запускается только если задана переменная
# KEYSTORE_BASE64 (CI/CD Variables). Нужны также: KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
assembleRelease:
  stage: build
  rules:
    - if: '$KEYSTORE_BASE64'
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_FILE="$CI_PROJECT_DIR/release.keystore"
    - ./gradlew --no-daemon assembleRelease bundleRelease
    - rm -f "$CI_PROJECT_DIR/release.keystore"
  artifacts:
    name: "currency-converter-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    expire_in: 1 month

# ---- Публикация (ручной запуск, активна при наличии креденшелов) ----
# Берёт собранный артефакт из assembleRelease, заливает в магазин.
# Не трогает Android-сборку, поэтому build остаётся стабильным.

# Google Play. Нужна переменная PLAY_SA_JSON_B64 = base64(service account JSON).
publish-googleplay:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$PLAY_SA_JSON_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet google-api-python-client google-auth
    - echo "$PLAY_SA_JSON_B64" | base64 -d > sa.json
    - python3 store/publish_googleplay.py --aab app/build/outputs/bundle/release/app-release.aab --package net.yukh.currency --track internal --credentials sa.json
    - rm -f sa.json

# RuStore. Нужны RUSTORE_KEY_ID и RUSTORE_KEY_B64 = base64(приватный RSA PEM).
publish-rustore:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$RUSTORE_KEY_ID && $RUSTORE_KEY_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet requests cryptography
    - echo "$RUSTORE_KEY_B64" | base64 -d > rustore_key.pem
    - python3 store/rustore_publish.py --apk app/build/outputs/apk/release/app-release.apk --package net.yukh.currency --key-id "$RUSTORE_KEY_ID" --key rustore_key.pem
    - rm -f rustore_key.pem
