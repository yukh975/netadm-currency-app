# Сборка Android APK в Docker-раннере GitLab.
# Образ с JDK 17, Android SDK ставится через cmdline-tools.
image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_CMDLINE_TOOLS: "11076708"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  # Версия приложения — единая с Telegram-ботом (ручной SemVer, см. CHANGELOG.md).
  # Поднимать вручную при выпуске новой версии.
  APP_VERSION: "0.3.2"

# Когда создавать пайплайн.
workflow:
  rules:
    # не запускать на создание тега (релиз сам делает тег) — без петли
    - if: '$CI_COMMIT_TAG'
      when: never
    # ручной запуск из UI/CLI — всегда (на случай пересборки без изменений кода)
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # собирать только при изменении кода или условий сборки
    - changes:
        - app/**/*
        - gradle/**/*
        - settings.gradle.kts
        - build.gradle.kts
        - gradle.properties
        - gradlew
        - gradlew.bat
        - .gitlab-ci.yml
    # иначе (README, CHANGELOG, store/* и пр.) — пайплайн не создаётся
    - when: never

stages:
  - build
  - release
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - .android-sdk/

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  - export ANDROID_HOME="$CI_PROJECT_DIR/.android-sdk"
  - export ANDROID_SDK_ROOT="$ANDROID_HOME"
  - mkdir -p "$ANDROID_HOME/cmdline-tools"
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      wget --quiet --output-document=cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
      unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      rm cmdline-tools.zip
    fi
  - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" > /dev/null
  - chmod +x ./gradlew

# Подписанный релиз (APK + AAB). Запускается только если задана переменная
# KEYSTORE_BASE64 (CI/CD Variables). Нужны также: KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
assembleRelease:
  stage: build
  rules:
    - if: '$KEYSTORE_BASE64'
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_FILE="$CI_PROJECT_DIR/release.keystore"
    - ./gradlew --no-daemon assembleRelease bundleRelease
    - rm -f "$CI_PROJECT_DIR/release.keystore"
  artifacts:
    name: "currency-converter-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    expire_in: 1 month

# ---- Релиз в GitLab: APK/AAB в Package Registry + запись в Releases ----

# Заливаем подписанные артефакты в Generic Package Registry (стабильные ссылки).
upload-packages:
  stage: release
  image: alpine:latest
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "android" && $KEYSTORE_BASE64'
  before_script: []
  cache: {}
  variables:
    VERSION: "$APP_VERSION"
    PKG_BASE: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION"
  script:
    - apk add --no-cache curl
    - APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
    - AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$APK" "$PKG_BASE/currency-converter-$VERSION.apk"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$AAB" "$PKG_BASE/currency-converter-$VERSION.aab"'

# Создаём GitLab Release с тегом и ссылками на артефакты в Package Registry.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload-packages
  rules:
    - if: '$CI_COMMIT_BRANCH == "android" && $KEYSTORE_BASE64'
  before_script: []
  cache: {}
  variables:
    VERSION: "$APP_VERSION"
  script:
    - echo "Создаю релиз v$APP_VERSION (пайплайн $CI_PIPELINE_IID)"
  release:
    tag_name: "v$APP_VERSION"
    name: "Конвертер валют v$APP_VERSION"
    ref: "$CI_COMMIT_SHA"
    description: "Релиз v$APP_VERSION (сборка пайплайна #$CI_PIPELINE_IID). Список изменений — в CHANGELOG.md."
    assets:
      links:
        - name: "APK (app-release)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION/currency-converter-$APP_VERSION.apk"
          link_type: "package"
        - name: "AAB (app-release)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/currency-converter/$APP_VERSION/currency-converter-$APP_VERSION.aab"
          link_type: "package"

# ---- Публикация (ручной запуск, активна при наличии креденшелов) ----
# Берёт собранный артефакт из assembleRelease, заливает в магазин.
# Не трогает Android-сборку, поэтому build остаётся стабильным.

# Google Play. Нужна переменная PLAY_SA_JSON_B64 = base64(service account JSON).
publish-googleplay:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$PLAY_SA_JSON_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet google-api-python-client google-auth
    - echo "$PLAY_SA_JSON_B64" | base64 -d > sa.json
    - AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
    - python3 store/publish_googleplay.py --aab "$AAB" --package net.yukh.currency --track internal --credentials sa.json
    - rm -f sa.json

# RuStore. Нужны RUSTORE_KEY_ID и RUSTORE_KEY_B64 = base64(приватный RSA PEM).
publish-rustore:
  stage: deploy
  image: python:3.12-slim
  needs:
    - job: assembleRelease
      artifacts: true
  rules:
    - if: '$RUSTORE_KEY_ID && $RUSTORE_KEY_B64'
      when: manual
  before_script: []
  cache: {}
  script:
    - pip install --quiet requests cryptography
    - echo "$RUSTORE_KEY_B64" | base64 -d > rustore_key.pem
    - APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
    - python3 store/rustore_publish.py --apk "$APK" --package net.yukh.currency --key-id "$RUSTORE_KEY_ID" --key rustore_key.pem
    - rm -f rustore_key.pem
